  <style>
    :root{
      --lime:#BDFF76;
      --lime-brand:#B8F772;
      --bg:#11121c;
      --ink:#F1F3EE;
      --ink-soft:rgba(241,243,238,.6);
      --grid:#191A23;
      --fd:'Roboto Flex','Roboto',system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
    .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    html,body{min-height:100%;font-family:var(--fd);color:var(--ink);
      background-color:var(--bg);
      background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
      background-size:100% 120px,120px 100%;background-position:0 90px,0 0}
    body{display:grid;place-items:center;padding:clamp(1.4rem,4vw,3rem);overflow-x:hidden}

    /* Brand — как на главной */
    .brand{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(2.2rem,7vh,4.5rem) 1rem clamp(1.4rem,3vh,2.2rem);pointer-events:none}
    .brand-name{display:flex;justify-content:center;color:var(--lime-brand)}
    .brand-name svg{height:clamp(1.125rem,2.25vw,1.5rem);width:auto;display:block}
    .brand-tag{display:flex;justify-content:center;margin-top:.9rem;color:rgba(255,255,255,.82)}
    .brand-tag svg{height:clamp(.7rem,1.1vw,.85rem);width:auto;display:block}

    .screen{width:min(920px,100%);min-height:min(620px,calc(100vh - 2.8rem));display:grid;align-items:center;position:relative}
    /* крупная «404» — водяной знак на фоне */
    .screen::before{content:'404';position:absolute;right:-.06em;top:50%;transform:translateY(-50%);
      font-size:clamp(9rem,31vw,22rem);font-weight:900;font-style:italic;font-variation-settings:'slnt' -10;
      letter-spacing:-.08em;line-height:.8;pointer-events:none;
      color:transparent;-webkit-text-stroke:2px rgba(189,255,118,.12)}
    .panel{position:relative;z-index:1;display:grid;gap:1.4rem;max-width:660px}
    .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--lime)}
    h1{font-size:clamp(2.9rem,11vw,6.6rem);line-height:.9;letter-spacing:-.045em;font-weight:900;font-style:italic;font-variation-settings:'slnt' -10}
    h1 span{display:block;color:var(--lime)}
    p.lead{max-width:540px;font-size:clamp(1rem,2.4vw,1.22rem);line-height:1.55;color:var(--ink-soft);font-weight:440}
    .actions{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:.3rem}
    .actions a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;padding:.78rem 1.35rem;text-decoration:none;font-weight:800;font-size:.95rem;transition:transform .18s,background .18s,border-color .18s,color .18s}
    .actions a:hover{transform:translateY(-2px)}
    .primary{background:var(--lime);color:var(--bg)}
    .primary:hover{background:#cbff92}
    .secondary{color:var(--ink);box-shadow:inset 0 0 0 1px rgba(241,243,238,.22)}
    .secondary:hover{box-shadow:inset 0 0 0 1px rgba(189,255,118,.7);color:var(--lime)}
    .route{font-size:.82rem;color:rgba(241,243,238,.4);font-weight:600;word-break:break-word;font-variant-numeric:tabular-nums}
    @media(max-width:560px){
      body{place-items:start center}
      .screen{min-height:calc(100vh - 2.8rem);align-items:center}
      .screen::before{opacity:.85}
      .actions{display:grid;grid-template-columns:1fr}
      .actions a{width:100%}
    }
  </style>
</head>
