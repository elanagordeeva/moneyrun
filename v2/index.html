  <style>
    :root{
      --lime:#BDFF76;
      --lime-deep:#9CD161;
      --lime-soft:#D5FFA8;
      --ink:#0e120e;
      --ink-soft:#1f2a05;
      --paper:#FAFFEC;
      --grid:rgba(31,42,5,.08);
      --fd:'Roboto Flex','Roboto',system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
    html,body{height:100%;overflow:hidden;background:var(--lime);font-family:var(--fd);color:var(--ink)}
    body{position:relative}

    /* Brand band — плоский блок на зелёном фоне, над картой */
    .brand{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(2.2rem,7vh,4.5rem) 1rem clamp(1.4rem,3vh,2.2rem);pointer-events:none}
    .brand-name{font-family:var(--fd);font-weight:900;font-style:italic;font-variation-settings:'slnt' -10;font-size:clamp(3rem,8vw,6.2rem);line-height:.92;letter-spacing:-.04em;color:var(--ink)}
    .brand-tag{font-family:var(--fd);font-weight:600;font-style:italic;font-variation-settings:'slnt' -10;font-size:clamp(1rem,1.6vw,1.4rem);color:var(--ink-soft);margin-top:.5rem;letter-spacing:.02em}

    /* Activity popup — minimalist capsule */
    .pops{position:fixed;inset:0;z-index:2;pointer-events:none}
    .pop{position:absolute;display:flex;align-items:center;gap:.55rem;background:rgba(14,18,14,.92);color:#fff;border-radius:999px;padding:3px 14px 3px 3px;box-shadow:0 8px 22px -8px rgba(14,18,14,.4);transform:translate(-50%,-130%) scale(.7);opacity:0;transition:transform .45s cubic-bezier(.2,.85,.25,1.05),opacity .3s ease;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .pop.in{opacity:1;transform:translate(-50%,-130%) scale(1)}
    .pop.out{opacity:0;transform:translate(-50%,-150%) scale(.94);transition:transform .4s ease,opacity .4s ease}

    .pop-ava{width:28px;height:28px;border-radius:50%;flex:none;background-size:cover;background-position:center;background-color:#444;background-repeat:no-repeat}
    .pop-line{font-family:var(--fd);font-size:.82rem;font-weight:600;color:#fff;letter-spacing:-.005em;display:flex;align-items:center;gap:.4rem;line-height:1}
    .pop-line .sep{opacity:.35;font-weight:400}
    .pop-line .city{font-weight:700}
    .pop-line .km{opacity:.78;font-variant-numeric:tabular-nums}
    .pop-line .gain{display:inline-flex;align-items:center;justify-content:center;min-height:22px;padding:0 8px;border-radius:999px;color:#20212A;font-weight:850;font-size:.72rem;font-style:italic;font-variation-settings:'slnt' -10;font-variant-numeric:tabular-nums;line-height:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
    .pop-line .gain-xp{background:linear-gradient(128deg,#A7FFC8 0%,#52D1FA 100%)}
    .pop-line .gain-rub{background:linear-gradient(90deg,#D5FFA8 0%,#BDFF76 100%)}

    /* GPS ping at the same coords */
    .ping{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--paper);opacity:0;animation:pingFade 4.6s ease forwards;pointer-events:none}
    .ping::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--ink);animation:pingExpand 1.4s ease-out infinite}
    @keyframes pingFade{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
    @keyframes pingExpand{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.6);opacity:0}}

    /* Help button */
    .help-btn{position:fixed;right:clamp(1rem,2.5vw,2rem);bottom:clamp(1rem,2.5vw,2rem);z-index:10;width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--lime);border:none;cursor:pointer;font-family:var(--fd);font-weight:900;font-size:1.5rem;display:grid;place-items:center;box-shadow:0 18px 36px -10px rgba(14,18,14,.5);transition:transform .25s,box-shadow .25s;line-height:1;animation:helpPulse 4.8s ease-in-out infinite}
    .help-btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 24px 48px -10px rgba(14,18,14,.6)}
    .help-btn svg{width:28px;height:28px;display:block;transform:translateX(-2px) rotate(-8deg);transform-origin:52% 58%;animation:helpMarkInvite 4.8s ease-in-out infinite}
    .help-btn:hover,.help-btn:focus-visible{animation-play-state:paused}
    .help-btn:hover svg,.help-btn:focus-visible svg{animation-play-state:paused;transform:translateX(-2px) rotate(-8deg) scale(1.07)}
    @keyframes helpPulse{0%,58%,100%{box-shadow:0 18px 36px -10px rgba(14,18,14,.5)}66%{box-shadow:0 18px 38px -10px rgba(14,18,14,.58),0 0 0 0 rgba(14,18,14,.18)}76%{box-shadow:0 22px 46px -12px rgba(14,18,14,.58),0 0 0 9px rgba(14,18,14,.08)}86%{box-shadow:0 18px 36px -10px rgba(14,18,14,.5),0 0 0 14px rgba(14,18,14,0)}}
    @keyframes helpMarkInvite{0%,60%,100%{transform:translateX(-2px) rotate(-8deg) scale(1)}70%{transform:translateX(-2px) rotate(-8deg) scale(1.12)}80%{transform:translateX(-2px) rotate(-8deg) scale(.98)}}
    @media(prefers-reduced-motion:reduce){.help-btn,.help-btn svg{animation:none}}
    .help-pop{position:fixed;right:clamp(1rem,2.5vw,2rem);bottom:calc(clamp(1rem,2.5vw,2rem) + 70px);z-index:10;background:#161a16;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:.4rem;display:flex;flex-direction:column;gap:.15rem;min-width:240px;box-shadow:0 28px 60px -16px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.4) inset;transform-origin:bottom right;transform:scale(.85) translateY(8px);opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.2,.85,.25,1.05),opacity .18s;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    .help-pop.open{transform:scale(1) translateY(0);opacity:1;pointer-events:auto}
    .help-pop a{display:flex;align-items:center;gap:.85rem;padding:.7rem .95rem;border-radius:12px;text-decoration:none;color:#f1f3ee;font-family:var(--fd);font-weight:600;font-size:.95rem;transition:background .15s,color .15s;letter-spacing:-.005em}
    .help-pop a:hover{background:rgba(189,255,118,.12);color:var(--lime-deep)}
    .help-pop a svg{width:18px;height:18px;flex:none;opacity:.85;transition:opacity .15s}
    .help-pop a:hover svg{opacity:1}
    .help-pop .lbl{font-family:var(--fd);font-size:.6rem;text-transform:uppercase;letter-spacing:.18em;color:rgba(255,255,255,.42);padding:.65rem .95rem .3rem;font-weight:700}
    .help-pop .sep{height:1px;background:rgba(255,255,255,.06);margin:.25rem .5rem}

    .mobile-dock{display:none}

    /* live indicator */
    .corner{position:fixed;left:clamp(1rem,2.5vw,2rem);bottom:clamp(1rem,2.5vw,2rem);z-index:5;font-family:var(--fd);font-size:.72rem;font-weight:600;color:var(--ink-soft);letter-spacing:.06em;opacity:.7;pointer-events:none;display:flex;align-items:center;gap:.5rem}
    .corner-dot{width:8px;height:8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px rgba(14,18,14,.18);animation:pulseDot 2s ease-in-out infinite}
    @keyframes pulseDot{0%,100%{box-shadow:0 0 0 3px rgba(14,18,14,.18)}50%{box-shadow:0 0 0 7px rgba(14,18,14,.05)}}

    /* Схематичная карта РФ на фоне */
    .rf-map{position:fixed;z-index:0;pointer-events:none;overflow:visible}
    .rf-map path{fill:rgba(31,42,5,.045);stroke:rgba(31,42,5,.22);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
    #mapdots{position:fixed;inset:0;z-index:1;pointer-events:none}
    .rf-dot{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(31,42,5,.42);transform:translate(-50%,-50%)}
    .rf-dot.major{width:9px;height:9px;background:var(--ink);box-shadow:0 0 0 3px rgba(189,255,118,.55)}
    @media(max-width:900px){.rf-dot.major{width:7px;height:7px}.rf-dot{width:5px;height:5px}}

    /* ── Варианты оформления карты ── */
    /* 2 · Заливка: силуэт залит тёмным, без обводки; точки светятся */
    body.map-filled .rf-map path{fill:rgba(31,42,5,.10);stroke:none}
    body.map-filled .rf-dot{background:rgba(31,42,5,.30)}
    body.map-filled .rf-dot.major{background:var(--ink);box-shadow:0 0 0 4px rgba(189,255,118,.7),0 0 18px 2px rgba(189,255,118,.5)}
    /* 3 · Созвездие: без силуэта, только точки + пунктирная сеть */
    body.map-constellation .rf-map{display:none}
    body.map-constellation .rf-dot{background:rgba(31,42,5,.5)}
    body.map-constellation .rf-dot.major{box-shadow:0 0 0 3px rgba(189,255,118,.6)}
    /* 4 · Контур: тонкая лаконичная обводка, точки только крупные города */
    body.map-line .rf-map path{fill:none;stroke:rgba(31,42,5,.34);stroke-width:2;stroke-dasharray:none}
    body.map-line .rf-dot:not(.major){display:none}
    body.map-line .rf-dot.major{width:8px;height:8px;box-shadow:0 0 0 3px rgba(189,255,118,.6)}
    /* 5 · Призрак: едва различимый силуэт, минимум контраста */
    body.map-ghost .rf-map path{fill:rgba(31,42,5,.03);stroke:rgba(31,42,5,.10);stroke-width:1.2}
    body.map-ghost .rf-dot{background:rgba(31,42,5,.22)}
    body.map-ghost .rf-dot.major{background:rgba(31,42,5,.6);box-shadow:0 0 0 3px rgba(189,255,118,.35)}
    /* 6 · Clean: без силуэта и без статичных точек, лого по центру поверх карты */
    body.map-clean .rf-map{display:none}
    body.map-clean #mapdots{display:none}
    body.map-clean .brand{top:0;bottom:0;justify-content:center;padding:1rem}

    @media(max-width:560px){
      html,body{height:100svh;min-height:100svh;max-height:100svh;overflow:hidden}
      body{position:fixed;inset:0;width:100%;overscroll-behavior:none}
      @supports(height:100dvh){

      .pop{gap:.35rem;padding:3px 8px 3px 3px;max-width:calc(100vw - 18px);box-shadow:0 10px 24px -12px rgba(14,18,14,.55)}
      .pop-ava{width:24px;height:24px}
      .pop-line{gap:.25rem;font-size:.68rem;min-width:0}
      .pop-line .city{max-width:7.2em;overflow:hidden;text-overflow:ellipsis}
      .pop-line .gain{min-height:20px;padding:0 6px;font-size:.64rem}
      .ping{width:10px;height:10px}
      .help-btn{right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:48px;height:48px;display:grid;font-size:1.35rem;box-shadow:0 16px 32px -10px rgba(14,18,14,.52)}
      .help-pop{right:12px;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;min-width:0;width:min(276px,calc(100vw - 24px));border-radius:20px;padding:7px}
      .help-pop a{min-height:42px;border-radius:14px;padding:.65rem .8rem;font-size:.86rem;font-weight:750}
      .help-pop .lbl{font-size:.56rem;padding:.6rem .8rem .25rem}
      .mobile-dock{display:none}
      .corner{display:none}
    }
  </style>
</head>

  {name:'Владивосток',    x: 832, y: 495},
  {name:'Петропавловск-Камчатский', x:1042, y:357},
  {name:'Анадырь',        x:1170, y: 200},
  {name:'Мурманск',       x:  97, y: 128},

const NAMES = ['Алексей П.','Мария В.','Иван С.','Елена К.','Дмитрий Л.','Анна Г.','Сергей М.','Ольга Р.','Артём В.','Полина З.','Никита О.','Юлия Ф.','Павел Б.','Ксения Т.','Илья Н.','Дарья И.','Кирилл А.','Софья Д.','Михаил Е.','Виктория Ж.','Роман Х.','Алиса Ц.','Тимур Я.','Лера Щ.','Глеб У.','Карина Й.','Олег Ч.','Настя Ш.'];

/* МОК-аватарки: подобранные фото-портреты (Unsplash, crop по лицу).
   Заменятся реальными данными по API. */
const AVATAR_PHOTOS = [
  '1506794778202-cad84cf45f1d','1500648767791-00dcc994a43e','1499996860823-5214fcc65f8f',
  '1568602471122-7832951cc4c5','1545167622-3a6ac756afa4','1547425260-76bcadfb4f2c',
  '1527082395-e939b847da0d','1494790108377-be9c29b29330','1517365830460-955ce3ccd263',
  '1499952127939-9bbf5af6c51c','1546961329-78bef0414d7c','1502685104226-ee32379fefbe',
  '1524504388940-b1c1722653e1'
];
const AVATAR_URL = id => `https://images.unsplash.com/photo-${id}?w=72&h=72&fit=crop&crop=faces&q=70`;
const pickAvatar = () => AVATAR_URL(pick(AVATAR_PHOTOS));

const pick = a => a[Math.floor(Math.random()*a.length)];
const weightedPick = items => {
  const total = items.reduce((sum,item)=>sum+item.weight,0);
  let roll = Math.random()*total;
  for (const item of items){
    roll -= item.weight;
    if (roll <= 0) return item;
  }
  return items[items.length-1];
};
const rand = ([min,max]) => Math.random()*(max-min)+min;

/* Правдоподобный mock начислений по правилам сервиса:
   XP держим в единицах/десятках за тренировку, ₽ = XP * тариф грейда. */
const WORKOUT_TYPES = [
  {weight:28, km:[3.2,7.5],  load:[.45,.95]},
  {weight:34, km:[5,11],     load:[.8,1.55]},
  {weight:16, km:[6,12],     load:[1.35,2.45]},
  {weight:10, km:[4,9],      load:[2.1,3.8]},
  {weight:12, km:[12,23.5],  load:[.9,1.85]}
];
const GRADE_RATES = [
  {weight:14, rate:3,  rq:[.8,1.05]},
  {weight:24, rate:4,  rq:[.9,1.2]},
  {weight:24, rate:7,  rq:[1,1.35]},
  {weight:18, rate:10, rq:[1.05,1.4]},
  {weight:12, rate:13, rq:[1.1,1.5]},
  {weight:6,  rate:16, rq:[1.2,1.5]},
  {weight:2,  rate:19, rq:[1.25,1.5]}
];

function mockWorkoutGains(){
  const workout = weightedPick(WORKOUT_TYPES);
  const grade = weightedPick(GRADE_RATES);
  const kmNum = rand(workout.km);
  const km = kmNum.toFixed(1).replace(/\.0$/, '');
  const iq = rand([.9,1.08]);
  const xp = Math.max(1, Math.min(60, Math.round(kmNum * rand(workout.load) * rand(grade.rq) * iq)));
  return { km, xp, rub: xp * grade.rate };
}

/* Вариант оформления карты через ?map=outline|filled|constellation|line|ghost|clean */
const MAP_VARIANTS = {outline:'',filled:'map-filled',constellation:'map-constellation',line:'map-line',ghost:'map-ghost',clean:'map-clean'};
const mapVariant = new URLSearchParams(location.search).get('map') || 'clean';
if (MAP_VARIANTS[mapVariant]) document.body.classList.add(MAP_VARIANTS[mapVariant]);
const isClean = mapVariant === 'clean';
const isMobileCompact = () => matchMedia('(max-width:560px)').matches;

/* Карта-как-экран: координаты городов растягиваются на весь viewport
   так чтобы Калининград был слева, Анадырь справа, Мурманск сверху,
   Сочи/Владивосток снизу. С небольшим safe-margin от краёв. */
function getBox(){
  const vw = innerWidth, vh = innerHeight;
  const mx = Math.max(60, vw*0.05);
  if (isClean){
    if (isMobileCompact()){
      const mobileMx = Math.max(18, vw*0.06);
      const top = Math.max(86, vh*0.16);
      const bottom = Math.max(142, vh*0.24);
      return { mx: mobileMx, top, w: vw - mobileMx*2, h: Math.max(260, vh - top - bottom) };
    }
    // карта на весь экран, лого по центру поверх
    const my = Math.max(70, vh*0.08);
    return { mx, top: my, w: vw - mx*2, h: vh - my*2 };
  }
  // верхний отступ карты = высота бренд-полосы + зазор, чтобы карта была ниже логотипа
  const brand = document.querySelector('.brand');
  const top = (brand ? brand.offsetHeight : 120) + 24;
  const bottom = Math.max(80, vh*0.08);
  return { mx, top, w: vw - mx*2, h: vh - top - bottom };
}
/* точка скрыта за центральным лого (только для clean-варианта) */
function behindBrand(px,py){
  if (!isClean) return false;
  const el = document.querySelector('.brand-inner') || document.querySelector('.brand');
  if (!el) return false;
  const r = el.getBoundingClientRect(), pad = 28;
  return px > r.left-pad && px < r.right+pad && py > r.top-pad && py < r.bottom+pad;
}
function svgToPx(x,y){
  const {mx,top,w,h} = getBox();
  return [ mx + (x/1200)*w, top + (y/500)*h ];
}

/* Фоновая карта: силуэт растягиваем в ту же рамку, статичные точки-города */
const MAJOR = new Set(['Москва','Санкт-Петербург','Калининград','Сочи','Казань','Екатеринбург','Новосибирск','Красноярск','Якутск','Владивосток','Мурманск']);
const rfmap = document.getElementById('rfmap');
const mapDots = document.getElementById('mapdots');

/* Опорные точки силуэта РФ (по часовой) в системе 1200x500 — сглаживаются сплайном */
const RF_OUTLINE = [
  [150,170],[112,124],[96,100],[131,150],[176,134],[241,160],[300,121],[361,150],
  [431,130],[510,96],[560,66],[611,101],[701,130],[800,120],[900,135],[1000,121],
  [1090,140],[1176,150],[1186,205],[1121,235],[1076,266],[1066,300],[1086,345],
  [1060,396],[1035,356],[1030,311],[981,321],[931,376],[896,425],[856,490],[836,500],
  [806,466],[761,436],[691,446],[611,451],[521,458],[471,440],[421,450],[351,450],
  [301,426],[256,446],[216,470],[196,455],[186,440],[166,475],[152,500],[133,478],
  [119,448],[106,410],[93,360],[96,300],[121,255],[141,210]
];
const RF_KLGD = [[3,285],[21,277],[29,293],[11,304]];

function smoothPath(pts){
  const n = pts.length, P = i => pts[(i%n+n)%n];
  let d = `M${P(0)[0]},${P(0)[1]}`;
  for (let i=0;i<n;i++){
    const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d += `C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d + 'Z';
}
rfmap.innerHTML = `<path d="${smoothPath(RF_OUTLINE)}"/><path d="${smoothPath(RF_KLGD)}"/>`;

function layoutMap(){
  const {mx,top,w,h} = getBox();
  rfmap.style.left = mx+'px'; rfmap.style.top = top+'px';
  rfmap.style.width = w+'px'; rfmap.style.height = h+'px';
  mapDots.innerHTML = '';
  // соединительные линии (только для варианта-созвездия)
  if (document.body.classList.contains('map-constellation')){
    const pts = CITIES.map(c=>svgToPx(c.x,c.y));
    let svg = `<svg width="${innerWidth}" height="${innerHeight}" style="position:fixed;inset:0;pointer-events:none" aria-hidden="true">`;
    for (let i=0;i<pts.length;i++){
      // соединяем каждый город с ближайшим соседом справа по индексу (даёт «маршрутную» сеть)
      const a=pts[i], b=pts[(i+1)%pts.length];
      svg += `<line x1="${a[0].toFixed(0)}" y1="${a[1].toFixed(0)}" x2="${b[0].toFixed(0)}" y2="${b[1].toFixed(0)}" stroke="rgba(31,42,5,.14)" stroke-width="1" stroke-dasharray="2 5"/>`;
    }
    svg += `</svg>`;
    mapDots.insertAdjacentHTML('beforeend', svg);
  }
  CITIES.forEach(c=>{
    const [px,py] = svgToPx(c.x,c.y);
    const d = document.createElement('div');
    d.className = 'rf-dot' + (MAJOR.has(c.name) ? ' major' : '');
    d.style.left = px+'px'; d.style.top = py+'px';
    mapDots.appendChild(d);
  });
}
layoutMap();
addEventListener('resize', layoutMap);
addEventListener('load', layoutMap);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutMap);

const popsLayer = document.getElementById('pops');
let mobilePopLane = 0;

function spawnPop(){
  const city = pick(CITIES);
  const name = pick(NAMES);
  const {km, xp, rub} = mockWorkoutGains();
  let [px, py] = svgToPx(city.x, city.y);
  if (isMobileCompact()){
    const lanes = [innerHeight*.42, innerHeight*.50, innerHeight*.58];
    py = lanes[mobilePopLane++ % lanes.length];
    px = Math.min(Math.max(px, innerWidth*.26), innerWidth*.74);
  }

  // в clean-варианте не показываем города, спрятанные за центральным лого
  if (behindBrand(px, py)) return;

  const ping = document.createElement('div');
  ping.className = 'ping';
  ping.style.left = px+'px'; ping.style.top = py+'px';
  popsLayer.appendChild(ping);

  const pop = document.createElement('div');
  pop.className = 'pop';
  pop.style.left = px+'px'; pop.style.top = py+'px';
  pop.innerHTML = `
    <div class="pop-ava" style="background-image:url('${pickAvatar()}')"></div>
    <div class="pop-line"><span class="city">${city.name}</span><span class="sep">·</span><span class="km">${km}&nbsp;км</span><span class="gain gain-xp">+${xp}&nbsp;XP</span><span class="gain gain-rub">+${rub}&nbsp;₽</span></div>`;
  popsLayer.appendChild(pop);
  // clamp inside viewport (popup translates by -50% so we need half its width)
  const popW = pop.offsetWidth, vw = window.innerWidth, margin = 12;
  let dx = 0;
  if (px - popW/2 < margin)        dx = margin - (px - popW/2);
  else if (px + popW/2 > vw-margin) dx = (vw - margin) - (px + popW/2);
  if (dx) pop.style.left = (px + dx) + 'px';
  requestAnimationFrame(()=>pop.classList.add('in'));

  setTimeout(()=>{ pop.classList.remove('in'); pop.classList.add('out'); }, 3800);
  setTimeout(()=>{ pop.remove(); ping.remove(); }, 4600);
}

const POP_DELAYS = [
  {weight:24, ms:[1600,3200]},
  {weight:46, ms:[4200,7600]},
  {weight:22, ms:[9000,14000]},
  {weight:8,  ms:[15000,22000]}
];
function nextPopDelay(){
  return Math.round(rand(weightedPick(POP_DELAYS).ms));
}
function spawnPopBurst(){
  const count = Math.random() < .08 ? 2 : 1;
  for (let i=0;i<count;i++){
    setTimeout(spawnPop, i * rand([520,1200]));
  }
}
(function scheduleNextPop(){
  setTimeout(()=>{
    spawnPopBurst();
    scheduleNextPop();
  }, nextPopDelay());
})();
for (let i=0;i<(isMobileCompact() ? 1 : 2);i++) setTimeout(spawnPop, rand([700,3600]));


const btn = document.getElementById('helpBtn');
const pop = document.getElementById('helpPop');
btn.addEventListener('click', e=>{
  e.stopPropagation();
  pop.classList.toggle('open');
  btn.setAttribute('aria-expanded', pop.classList.contains('open') ? 'true' : 'false');
});
document.addEventListener('click', e=>{
  if (pop.classList.contains('open') && !pop.contains(e.target) && e.target!==btn){
    pop.classList.remove('open');
    btn.setAttribute('aria-expanded','false');
  }
});
document.addEventListener('keydown', e=>{
  if (e.key==='Escape' && pop.classList.contains('open')){
    pop.classList.remove('open');
    btn.setAttribute('aria-expanded','false');
  }
});
</script>
