  <path d="M833 170 L817 188 M817 180 L817 188 L825 188" stroke="#1f4a8e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="840" y="328" text-anchor="middle" font-size="20" font-weight="800" fill="#0e120e">B+</text>

  <!-- A (0.34) -->
  <rect x="920" y="215" width="80" height="85" fill="url(#hgB)" rx="6"/>
  <rect x="932" y="187" width="56" height="32" rx="9" fill="#5b9bff"/>
  <text x="960" y="209" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">×0.34</text>
  <path d="M953 170 L937 188 M937 180 L937 188 L945 188" stroke="#1f4a8e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="960" y="328" text-anchor="middle" font-size="20" font-weight="800" fill="#0e120e">A</text>

  <!-- A+ (0.24) -->
  <rect x="1040" y="230" width="80" height="70" fill="url(#hgB)" rx="6"/>
  <rect x="1052" y="202" width="56" height="32" rx="9" fill="#5b9bff"/>
  <text x="1080" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">×0.24</text>
  <path d="M1073 170 L1057 188 M1057 180 L1057 188 L1065 188" stroke="#1f4a8e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
