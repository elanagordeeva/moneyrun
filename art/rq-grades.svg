  <!-- C+ transition -->
  <rect x="560" y="50" width="80" height="125" fill="url(#hgGL)" rx="6" ry="6"/>
  <rect x="560" y="175" width="80" height="125" fill="url(#hgG)"/>
  <rect x="568" y="22" width="64" height="32" rx="9" fill="#d0f85d"/>
