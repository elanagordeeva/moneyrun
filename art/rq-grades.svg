<svg viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg" font-family="Manrope, 'Roboto Flex', system-ui, sans-serif" fill="none">
  <defs>
    <pattern id="hgG" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#d5f29c"/>
      <rect width="7" height="14" fill="#bee14b"/>
    </pattern>
    <pattern id="hgGL" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#f1fadb"/>
      <rect width="7" height="14" fill="#e2f1bb"/>
    </pattern>
    <pattern id="hgB" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#dfeaff"/>
      <rect width="7" height="14" fill="#bcdcff"/>
    </pattern>
  </defs>

  <line x1="60" y1="300" x2="1140" y2="300" stroke="#0e120e" stroke-opacity=".22" stroke-width="2"/>
  <line x1="60" y1="175" x2="1140" y2="175" stroke="#5e6770" stroke-width="2" stroke-dasharray="9 6"/>

  <!-- D -->
  <rect x="80" y="50" width="80" height="250" fill="url(#hgG)" rx="6"/>
  <rect x="92" y="22" width="56" height="32" rx="9" fill="#d0f85d"/>
  <text x="120" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a05">×1.5</text>
  <path d="M97 188 L113 170 M113 178 L113 170 L105 170" stroke="#5e8e1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="328" text-anchor="middle" font-size="20" font-weight="800" fill="#0e120e">D</text>

  <!-- D1 -->
  <rect x="200" y="50" width="80" height="250" fill="url(#hgG)" rx="6"/>
  <rect x="212" y="22" width="56" height="32" rx="9" fill="#d0f85d"/>
  <text x="240" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a05">×1.5</text>
  <path d="M217 188 L233 170 M233 178 L233 170 L225 170" stroke="#5e8e1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="240" y="328" text-anchor="middle" font-size="20" font-weight="800" fill="#0e120e">D1</text>

  <!-- D2 -->
  <rect x="320" y="50" width="80" height="250" fill="url(#hgG)" rx="6"/>
  <rect x="332" y="22" width="56" height="32" rx="9" fill="#d0f85d"/>
  <text x="360" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a05">×1.5</text>
  <path d="M337 188 L353 170 M353 178 L353 170 L345 170" stroke="#5e8e1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="360" y="328" text-anchor="middle" font-size="20" font-weight="800" fill="#0e120e">D2</text>

  <!-- C -->
  <rect x="440" y="50" width="80" height="250" fill="url(#hgG)" rx="6"/>
  <rect x="452" y="22" width="56" height="32" rx="9" fill="#d0f85d"/>
  <text x="480" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a05">×1.5</text>
  <path d="M457 188 L473 170 M473 178 L473 170 L465 170" stroke="#5e8e1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
