<svg viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg" font-family="Manrope, 'Roboto Flex', system-ui, sans-serif" fill="none">
  <defs>
    <pattern id="hgG" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#d5f29c"/>
      <rect width="7" height="14" fill="#bee14b"/>
    </pattern>
    <pattern id="hgGL" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#f1fadb"/>
      <rect width="7" height="14" fill="#e2f1bb"/>
    </pattern>
    <pattern id="hgB" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#dfeaff"/>
      <rect width="7" height="14" fill="#bcdcff"/>
    </pattern>
    <pattern id="hgBL" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#eef4fc"/>
      <rect width="7" height="14" fill="#d8e7f8"/>
    </pattern>
  </defs>

  <line x1="60" y1="300" x2="1140" y2="300" stroke="#0e120e" stroke-opacity=".22" stroke-width="2"/>
  <line x1="60" y1="175" x2="1140" y2="175" stroke="#5e6770" stroke-width="2" stroke-dasharray="9 6"/>

  <!-- D -->
  <rect x="80" y="50" width="80" height="250" fill="url(#hgG)" rx="6"/>
  <rect x="80" y="22" width="80" height="32" rx="9" fill="#d0f85d"/>
  <text x="120" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a05">×1.5</text>
  <path d="M97 192 L113 175 M113 183 L113 175 L105 175" stroke="#5e8e1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="328" text-anchor="middle" font-size="20" font-weight="800" fill="#0e120e">D</text>

  <!-- D1 -->
  <rect x="200" y="50" width="80" height="250" fill="url(#hgG)" rx="6"/>
  <rect x="200" y="22" width="80" height="32" rx="9" fill="#d0f85d"/>
  <text x="240" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a05">×1.5</text>
  <path d="M217 192 L233 175 M233 183 L233 175 L225 175" stroke="#5e8e1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="240" y="328" text-anchor="middle" font-size="20" font-weight="800" fill="#0e120e">D1</text>

  <!-- D2 -->
  <rect x="320" y="50" width="80" height="250" fill="url(#hgG)" rx="6"/>
  <rect x="320" y="22" width="80" height="32" rx="9" fill="#d0f85d"/>
  <text x="360" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a05">×1.5</text>
  <path d="M337 192 L353 175 M353 183 L353 175 L345 175" stroke="#5e8e1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="360" y="328" text-anchor="middle" font-size="20" font-weight="800" fill="#0e120e">D2</text>

  <!-- C -->
  <rect x="440" y="50" width="80" height="250" fill="url(#hgG)" rx="6"/>
  <rect x="440" y="22" width="80" height="32" rx="9" fill="#d0f85d"/>
  <text x="480" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a05">×1.5</text>
  <path d="M457 192 L473 175 M473 183 L473 175 L465 175" stroke="#5e8e1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="328" text-anchor="middle" font-size="20" font-weight="800" fill="#0e120e">C</text>

  <!-- C+ transition: top half light, bottom half full green -->
  <rect x="560" y="50" width="80" height="250" fill="url(#hgGL)" rx="6"/>
  <rect x="560" y="175" width="80" height="125" fill="url(#hgG)" rx="6"/>
  <rect x="560" y="22" width="80" height="32" rx="9" fill="#d0f85d"/>
  <text x="600" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2a05">×1.5..1.0</text>
  <path d="M577 192 L593 175 M593 183 L593 175 L585 175" stroke="#5e8e1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="328" text-anchor="middle" font-size="20" font-weight="800" fill="#0e120e">C+</text>

  <!-- B (0.7): container same size, solid fill from y=212 -->
  <rect x="680" y="50" width="80" height="250" fill="url(#hgBL)" rx="6"/>
  <rect x="680" y="212" width="80" height="88" fill="url(#hgB)" rx="6"/>
  <rect x="680" y="22" width="80" height="32" rx="9" fill="#5b9bff"/>
  <text x="720" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">×0.7</text>
  <path d="M713 222 L697 239 M697 231 L697 239 L705 239" stroke="#1f4a8e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="720" y="328" text-anchor="middle" font-size="20" font-weight="800" fill="#0e120e">B</text>

  <!-- B+ (0.49): solid fill from y=239 -->
  <rect x="800" y="50" width="80" height="250" fill="url(#hgBL)" rx="6"/>
  <rect x="800" y="239" width="80" height="61" fill="url(#hgB)" rx="6"/>
  <rect x="800" y="22" width="80" height="32" rx="9" fill="#5b9bff"/>
  <text x="840" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">×0.49</text>
  <path d="M833 247 L817 264 M817 256 L817 264 L825 264" stroke="#1f4a8e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="840" y="328" text-anchor="middle" font-size="20" font-weight="800" fill="#0e120e">B+</text>

  <!-- A (0.34): solid fill from y=258 -->
  <rect x="920" y="50" width="80" height="250" fill="url(#hgBL)" rx="6"/>
  <rect x="920" y="258" width="80" height="42" fill="url(#hgB)" rx="6"/>
  <rect x="920" y="22" width="80" height="32" rx="9" fill="#5b9bff"/>
  <text x="960" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">×0.34</text>
  <path d="M953 264 L937 281 M937 273 L937 281 L945 281" stroke="#1f4a8e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="960" y="328" text-anchor="middle" font-size="20" font-weight="800" fill="#0e120e">A</text>

  <!-- A+ (0.24): solid fill from y=270 -->
  <rect x="1040" y="50" width="80" height="250" fill="url(#hgBL)" rx="6"/>
  <rect x="1040" y="270" width="80" height="30" fill="url(#hgB)" rx="6"/>
  <rect x="1040" y="22" width="80" height="32" rx="9" fill="#5b9bff"/>
  <text x="1080" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">×0.24</text>
  <path d="M1073 274 L1057 289 M1057 282 L1057 289 L1064 289" stroke="#1f4a8e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1080" y="328" text-anchor="middle" font-size="20" font-weight="800" fill="#0e120e">A+</text>

  <!-- Legend -->
  <g transform="translate(160, 380)" font-family="Inter, system-ui, sans-serif">
    <circle cx="12" cy="12" r="12" fill="none" stroke="#5e6770" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="34" y="18" font-size="15" font-weight="500" fill="#0e120e">Текущий Грейд ~ текущий RL</text>

    <rect x="340" y="0" width="24" height="24" rx="5" fill="#d0f85d"/>
    <text x="374" y="18" font-size="15" font-weight="500" fill="#0e120e">RL выше текущего Грейда</text>

    <rect x="660" y="0" width="24" height="24" rx="5" fill="#bcdcff"/>
    <text x="694" y="18" font-size="15" font-weight="500" fill="#0e120e">RL ниже текущего Грейда</text>
  </g>
</svg>
