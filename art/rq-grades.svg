  <!-- Legend -->
  <g transform="translate(160, 380)" font-family="Inter, system-ui, sans-serif">
    <circle cx="12" cy="12" r="12" fill="none" stroke="#5e6770" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="34" y="18" font-size="15" font-weight="500" fill="#0e120e">Текущий Грейд ~ текущий RL</text>

    <rect x="340" y="0" width="24" height="24" rx="5" fill="#d0f85d"/>
    <text x="374" y="18" font-size="15" font-weight="500" fill="#0e120e">RL выше текущего Грейда</text>

    <rect x="660" y="0" width="24" height="24" rx="5" fill="#bcdcff"/>
    <text x="694" y="18" font-size="15" font-weight="500" fill="#0e120e">RL ниже текущего Грейда</text>
