<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Подключи трекер: часы и телефон">
  <!-- Lime background -->
  <rect width="200" height="200" fill="#d5ffa8"/>

  <!-- ─── RIGHT: Phone with route on screen ─── -->
  <!-- Phone body (silhouette) -->
  <rect x="100" y="34" width="82" height="142" rx="13" fill="#15182a"/>
  <!-- Phone speaker slot -->
  <rect x="129" y="44" width="24" height="3.5" rx="1.5" fill="#d5ffa8"/>
  <!-- Home button -->
  <circle cx="141" cy="168" r="4" fill="#d5ffa8"/>
  <!-- Phone screen (lime cutout) -->
  <rect x="108" y="55" width="66" height="104" rx="3" fill="#d5ffa8"/>

  <!-- Map pin on screen -->
  <path d="M 130 68 C 123.5 68 119 72.5 119 79 C 119 86 130 100 130 100 C 130 100 141 86 141 79 C 141 72.5 136.5 68 130 68 Z" fill="#15182a"/>
  <circle cx="130" cy="78.5" r="3.5" fill="#d5ffa8"/>

  <!-- Route path (wiggly) -->
  <path d="M 130 100 C 144 108 116 118 130 128 C 144 138 116 146 138 154" fill="none" stroke="#15182a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Route end -->
  <circle cx="138" cy="154" r="4.2" fill="#15182a"/>
  <circle cx="138" cy="154" r="1.8" fill="#d5ffa8"/>

  <!-- ─── CENTER: dotted sync arc ─── -->
  <g fill="#15182a">
    <circle cx="80" cy="46" r="2.7"/>
    <circle cx="89" cy="42" r="2.7"/>
    <circle cx="98" cy="44" r="2.7"/>
    <circle cx="105" cy="51" r="2.7"/>
    <circle cx="104" cy="62" r="2.7"/>
    <circle cx="97" cy="71" r="2.7"/>
    <circle cx="85" cy="78" r="2.7"/>
    <circle cx="73" cy="86" r="2.7"/>
    <circle cx="67" cy="98" r="2.7"/>
    <circle cx="68" cy="112" r="2.7"/>
    <circle cx="74" cy="126" r="2.7"/>
    <circle cx="84" cy="139" r="2.7"/>
    <circle cx="96" cy="149" r="2.7"/>
    <circle cx="108" cy="156" r="2.7"/>
  </g>

  <!-- ─── LEFT: Wrist with smart watch ─── -->
  <!-- Fist/wrist silhouette -->
  <path d="M 22 96 C 22 88 27 80 38 78 L 64 74 C 76 73 82 80 82 92 L 80 116 C 79 132 70 144 56 144 L 40 142 C 28 140 22 128 22 116 Z" fill="#15182a"/>
  <!-- Watch band — upper -->
  <rect x="27" y="68" width="20" height="10" rx="2" fill="#15182a"/>
  <!-- Watch band — lower -->
  <rect x="27" y="124" width="20" height="10" rx="2" fill="#15182a"/>
  <!-- Watch case (squared smart-watch) -->
  <rect x="6" y="75" width="48" height="56" rx="10" fill="#15182a"/>
  <!-- Watch crown -->
  <rect x="54" y="98" width="3.5" height="10" rx="1" fill="#15182a"/>
  <!-- Watch screen -->
  <rect x="12" y="81" width="36" height="44" rx="5" fill="#15182a" stroke="#d5ffa8" stroke-width="1.6"/>
  <!-- Pulse line on watch screen (lime on dark) -->
  <path d="M 15 103 L 19 103 L 21.5 95 L 25 110 L 28 100 L 31 108 L 34 103 L 45 103" fill="none" stroke="#d5ffa8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
