<svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Обмен XP на рубли">
  <!-- Sky background -->
  <rect width="260" height="260" fill="#bcdcff"/>

  <g transform="translate(30,30)">
    <!-- Top circular arrow (clockwise, upper) -->
    <path d="M 28 60 Q 28 24 70 24 Q 105 24 128 46"
          fill="none" stroke="#15182a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 128 46 L 110 38 L 122 22 Z" fill="#15182a"/>

    <!-- Bottom circular arrow (clockwise, lower) -->
    <path d="M 172 140 Q 172 176 130 176 Q 95 176 72 154"
          fill="none" stroke="#15182a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 72 154 L 90 162 L 78 178 Z" fill="#15182a"/>

    <!-- Coin (right-side, small) -->
    <circle cx="158" cy="74" r="20" fill="#15182a"/>
    <circle cx="158" cy="74" r="13" fill="none" stroke="#bcdcff" stroke-width="2"/>

    <!-- Credit card (centered, slight rotation) -->
    <g transform="translate(96,108) rotate(-12)">
      <rect x="-60" y="-38" width="120" height="76" rx="10" fill="#15182a"/>
      <!-- Card chip -->
      <rect x="-44" y="-20" width="20" height="16" rx="3" fill="#bcdcff"/>
      <!-- Chip detail lines -->
      <line x1="-44" y1="-12" x2="-24" y2="-12" stroke="#15182a" stroke-width="1.4"/>
      <line x1="-34" y1="-20" x2="-34" y2="-4" stroke="#15182a" stroke-width="1.4"/>
      <!-- Card stripe/number -->
      <rect x="14" y="14" width="40" height="8" rx="2" fill="#bcdcff" opacity="0.55"/>
    </g>
  </g>
</svg>
