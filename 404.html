<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Страница не найдена — Moneyrun</title>
  <meta name="description" content="Страница Moneyrun не найдена. Перейдите на главную, в правила платформы или в Telegram-канал.">
  <meta name="theme-color" content="#BDFF76">
  <link rel="icon" type="image/png" href="https://static.tildacdn.com/tild6335-6462-4965-b561-643434616164/Logo_32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,slnt,wght@8..144,-10..0,300..1000&display=swap" rel="stylesheet">
  <style>
    :root{--lime:#BDFF76;--lime-deep:#9CD161;--ink:#0e120e;--ink-soft:#27320c;--paper:#FAFFEC;--fd:'Roboto Flex','Roboto',system-ui,sans-serif}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
    html,body{min-height:100%;font-family:var(--fd);background:var(--lime);color:var(--ink)}
    body{display:grid;place-items:center;padding:clamp(1.2rem,4vw,3rem);overflow-x:hidden}
    .screen{width:min(980px,100%);min-height:min(660px,calc(100vh - 2.4rem));display:grid;align-items:center;position:relative}
    .screen::before{content:'404';position:absolute;right:-.08em;top:50%;transform:translateY(-50%);font-size:clamp(9rem,31vw,22rem);font-weight:900;font-style:italic;font-variation-settings:'slnt' -10;letter-spacing:-.08em;color:rgba(14,18,14,.08);line-height:.8;pointer-events:none}
    .panel{position:relative;z-index:1;display:grid;gap:1.5rem;max-width:720px}
    .logo{width:min(260px,58vw);height:auto;display:block}
    .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
    h1{font-size:clamp(3.2rem,12vw,7.8rem);line-height:.88;letter-spacing:-.045em;font-weight:900;font-style:italic;font-variation-settings:'slnt' -10}
    h1 span{display:block;color:var(--paper)}
    p{max-width:580px;font-size:clamp(1.02rem,2.5vw,1.28rem);line-height:1.55;color:var(--ink-soft);font-weight:560}
    .actions{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:.25rem}
    .actions a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border-radius:999px;padding:.76rem 1.05rem;text-decoration:none;font-weight:820;font-size:.95rem;transition:transform .18s,background .18s,color .18s}
    .actions a:hover{transform:translateY(-2px)}
    .primary{background:var(--ink);color:var(--lime)}
    .secondary{background:rgba(14,18,14,.1);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(14,18,14,.12)}
    .route{font-size:.82rem;color:rgba(14,18,14,.55);font-weight:650;word-break:break-word}
    @media(max-width:560px){
      body{place-items:start center}
      .screen{min-height:calc(100vh - 2.4rem);align-items:center}
      .actions{display:grid;grid-template-columns:1fr}
      .actions a{width:100%}
    }
  </style>
</head>
<body>
  <main class="screen">
    <section class="panel" aria-labelledby="not-found-title">
      <img class="logo" src="https://elanagordeeva.github.io/moneyrun/art/logo-hor-black.svg" alt="Moneyrun">
      <p class="eyebrow">Страница не найдена</p>
      <h1 id="not-found-title">Такой <span>дистанции нет</span></h1>
      <p>Адрес мог измениться или страница ушла с маршрута. Вернитесь на главную, откройте правила платформы или напишите в Telegram.</p>
      <nav class="actions" aria-label="Куда перейти">
        <a class="primary" href="https://moneyrun.tech/">На главную</a>
        <a class="secondary" href="https://moneyrun.tech/guide">Правила платформы</a>
        <a class="secondary" href="https://t.me/moneyrun" target="_blank" rel="noopener">Telegram</a>
      </nav>
      <p class="route" id="route"></p>
    </section>
  </main>
  <script>
    const route = document.getElementById('route');
    if (route) route.textContent = location.pathname;
  </script>
</body>
</html>
